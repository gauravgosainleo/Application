<!doctype html>
<html lang="en" data-theme="vice">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>G VI Fan Hub</title>
  <meta name="description" content="G VI Fan Hub — the fan companion app for Grand Theft Auto VI: countdown, news, trailers, interactive Leonida map, friends & chat, discussions, polls, events and rewards.">
  <meta name="theme-color" content="#0a0612">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="G VI Hub">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="app">
    <div class="boot">
      <img src="assets/img/logo.svg" alt="" class="boot-logo">
      <div class="boot-name">G VI <span>FAN HUB</span></div>
      <span class="spinner lg"></span>
    </div>
  </div>
  <noscript><p style="padding:24px;color:#fff;font-family:sans-serif">G VI Fan Hub needs JavaScript to run. Please enable it in your browser.</p></noscript>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
