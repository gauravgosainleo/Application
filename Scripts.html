<script>
  // ==================== GLOBAL VARIABLES ====================
  let currentUser = null;
  let userPermissions = null;

  // Calendar
  let calendarEvents = [];
  let currentCalendarDate = new Date();

  // Training form
  let currentTrainingStep = 1;
  const trainingStore = {
    applications: [],
    traineeNames: [],
    traineeEmails: [],
    levels: []
  };

  // Settings cache (dropdowns)
  let settingsOptionsCache = { categories: [], applications: [] };

  // Current active category for dynamic sections
  let currentActiveCategory = null;

  // Quiz Module Variables
  let currentQuizData = null;
  let quizStartTime = null;
  let quizTimerInterval = null;
  let selectedQuizTrainees = [];

  // ==================== UTILITY ====================

  function showLoading(show = true) {
    const overlay = document.getElementById('loadingOverlay');
    if (!overlay) return;
    overlay.classList.toggle('active', show);
  }

  function showToast(message, type = 'info') {
    const toast = document.getElementById('toast');
    if (!toast) return;

    const icon = toast.querySelector('.toast-icon');
    const msg = toast.querySelector('.toast-message');

    toast.className = 'toast ' + type;
    msg.textContent = message;

    const icons = {
      success: 'fas fa-check-circle',
      error: 'fas fa-exclamation-circle',
      info: 'fas fa-info-circle',
      warning: 'fas fa-exclamation-triangle'
    };

    icon.className = 'toast-icon ' + (icons[type] || icons.info);
    toast.classList.add('show');

    setTimeout(() => toast.classList.remove('show'), 4000);
  }

  function capitalizeFirst(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  // ==================== LOGIN ====================

  function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleIcon.classList.remove('fa-eye');
      toggleIcon.classList.add('fa-eye-slash');
    } else {
      passwordInput.type = 'password';
      toggleIcon.classList.remove('fa-eye-slash');
      toggleIcon.classList.add('fa-eye');
    }
  }

  function handleLogin(event) {
    event.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const loginBtn = document.getElementById('loginBtn');

    loginBtn.querySelector('.btn-text').style.display = 'none';
    loginBtn.querySelector('.btn-loader').style.display = 'inline-block';
    loginBtn.disabled = true;

    google.script.run
      .withSuccessHandler(function(result) {
        loginBtn.querySelector('.btn-text').style.display = 'inline';
        loginBtn.querySelector('.btn-loader').style.display = 'none';
        loginBtn.disabled = false;

        if (result.success) {
          currentUser = result.user;
          showDashboard();
        } else {
          showToast(result.message || 'Invalid email or password', 'error');
        }
      })
      .withFailureHandler(function(error) {
        loginBtn.querySelector('.btn-text').style.display = 'inline';
        loginBtn.querySelector('.btn-loader').style.display = 'none';
        loginBtn.disabled = false;
        showToast('Login failed: ' + error.message, 'error');
      })
      .authenticateUser(email, password);
  }

  function showForgotPassword() {
    document.getElementById('forgotPasswordModal').classList.add('active');
  }

  function closeForgotPassword() {
    document.getElementById('forgotPasswordModal').classList.remove('active');
    document.getElementById('recoveryEmail').value = '';
  }

  function handleForgotPassword(event) {
    event.preventDefault();

    const email = document.getElementById('recoveryEmail').value.trim();
    const recoveryBtn = document.getElementById('recoveryBtn');

    recoveryBtn.querySelector('.btn-text').style.display = 'none';
    recoveryBtn.querySelector('.btn-loader').style.display = 'inline-block';
    recoveryBtn.disabled = true;

    google.script.run
      .withSuccessHandler(function(result) {
        recoveryBtn.querySelector('.btn-text').style.display = 'inline';
        recoveryBtn.querySelector('.btn-loader').style.display = 'none';
        recoveryBtn.disabled = false;

        if (result.success) {
          showToast('Password sent to your email!', 'success');
          closeForgotPassword();
        } else {
          showToast(result.message || 'Email not found', 'error');
        }
      })
      .withFailureHandler(function(error) {
        recoveryBtn.querySelector('.btn-text').style.display = 'inline';
        recoveryBtn.querySelector('.btn-loader').style.display = 'none';
        recoveryBtn.disabled = false;
        showToast('Failed to send password: ' + error.message, 'error');
      })
      .sendPasswordRecovery(email);
  }

  function logout() {
    currentUser = null;
    userPermissions = null;
    document.getElementById('dashboardScreen').classList.remove('active');
    document.getElementById('loginScreen').classList.add('active');
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  }

  // ==================== DASHBOARD ====================

  function showDashboard() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('dashboardScreen').classList.add('active');

    document.getElementById('userName').textContent = currentUser.name || currentUser.email;
    document.getElementById('userTypeBadge').textContent = currentUser.type || 'User';

    // Show/hide Add Training button (hide for trainee)
    const addTrainingBtn = document.querySelector('.btn-add-training');
    if (addTrainingBtn) {
      const userType = (currentUser.type || '').toLowerCase().trim();
      addTrainingBtn.classList.toggle('btn-hidden', userType === 'trainee');
    }

    // Settings button visibility (trainer only)
    updateSettingsButtonVisibility();

    // Load permissions
    loadUserPermissions();

    // Init calendar
    populateYearFilter();
    loadCalendarEvents();

    // Load categories for sidebar
    loadCategoriesForSidebar();
  }

  function loadUserPermissions() {
    google.script.run
      .withSuccessHandler(function(permissions) {
        userPermissions = permissions || getDefaultPermissions();
        applyPermissions();
      })
      .withFailureHandler(function(error) {
        console.error('Failed to load permissions:', error);
        userPermissions = getDefaultPermissions();
        applyPermissions();
      })
      .getUserPermissions(currentUser.type);
  }

  function getDefaultPermissions() {
    return {
      ilt: { dashboard: false, progress: true, evaluations: true, reports: false },
      sbl: { dashboard: false, videos: true, evaluations: true, reports: false },
      compliance: { calendar: true, status: true, reports: true, management: false }
    };
  }

  function applyPermissions() {
    if (!userPermissions) return;

    toggleTabVisibility('iltDashboardTab', userPermissions.ilt.dashboard);
    toggleTabVisibility('iltProgressTab', userPermissions.ilt.progress);
    toggleTabVisibility('iltEvaluationsTab', userPermissions.ilt.evaluations);
    toggleTabVisibility('iltReportsTab', userPermissions.ilt.reports);

    toggleTabVisibility('sblDashboardTab', userPermissions.sbl.dashboard);
    toggleTabVisibility('sblVideosTab', userPermissions.sbl.videos);
    toggleTabVisibility('sblEvaluationsTab', userPermissions.sbl.evaluations);
    toggleTabVisibility('sblReportsTab', userPermissions.sbl.reports);

    toggleTabVisibility('complianceCalendarTab', userPermissions.compliance.calendar);
    toggleTabVisibility('complianceStatusTab', userPermissions.compliance.status);
    toggleTabVisibility('complianceReportsTab', userPermissions.compliance.reports);
    toggleTabVisibility('complianceManagementTab', userPermissions.compliance.management);
  }

  function toggleTabVisibility(tabId, isVisible) {
    const tab = document.getElementById(tabId);
    if (!tab) return;

    if (isVisible) {
      tab.classList.remove('disabled');
      tab.style.display = '';
    } else {
      tab.classList.add('disabled');
      tab.style.display = 'none';
    }
  }

  // ==================== SIDEBAR CATEGORIES ====================

  // Default categories that always appear in sidebar with their icons
  const DEFAULT_SIDEBAR_ITEMS = [
    { name: 'Calendar', icon: 'fa-calendar-alt', section: 'calendar' },
    { name: 'ILT', icon: 'fa-chalkboard-teacher', section: 'ilt' },
    { name: 'SBL', icon: 'fa-video', section: 'sbl' },
    { name: 'Compliance', icon: 'fa-clipboard-check', section: 'compliance' },
    { name: 'Others', icon: 'fa-ellipsis-h', section: 'others' }
  ];

  // Map category names to icons
  const CATEGORY_ICONS = {
    'ilt': 'fa-chalkboard-teacher',
    'sbl': 'fa-video',
    'isms': 'fa-shield-alt',
    'misc': 'fa-folder',
    'compliance': 'fa-clipboard-check',
    'calendar': 'fa-calendar-alt',
    'others': 'fa-ellipsis-h',
    'hr': 'fa-users',
    'sales': 'fa-chart-line',
    'product': 'fa-box',
    'technical': 'fa-cogs',
    'onboarding': 'fa-user-plus',
    'leadership': 'fa-crown',
    'soft skills': 'fa-comments',
    'safety': 'fa-hard-hat'
  };

  function getCategoryIcon(categoryName) {
    const lowerName = categoryName.toLowerCase();
    if (CATEGORY_ICONS[lowerName]) {
      return CATEGORY_ICONS[lowerName];
    }
    // Default icon for custom categories
    return 'fa-tag';
  }

  function loadCategoriesForSidebar() {
    google.script.run
      .withSuccessHandler(function(opts) {
        settingsOptionsCache = opts || { categories: [], applications: [] };
        renderSidebarWithCategories();
      })
      .withFailureHandler(function(err) {
        console.error('Failed to load categories for sidebar:', err);
        renderSidebarWithCategories();
      })
      .getDropdownOptions();
  }

  function renderSidebarWithCategories() {
    const container = document.getElementById('categoryMenuContainer');
    if (!container) return;

    // Get custom categories that are not in the default list
    const defaultNames = ['ilt', 'sbl', 'isms', 'misc'];
    const categories = (settingsOptionsCache.categories || []).filter(
      c => !defaultNames.includes(c.toLowerCase())
    );

    // Build HTML for ILT, SBL, ISMS, Misc (always shown)
    let html = '';

    // ILT
    html += `
      <div class="menu-item" data-key="ilt" onclick="showSection('ilt')" role="button" tabindex="0">
        <i class="fas fa-chalkboard-teacher"></i>
        <span>ILT</span>
      </div>
    `;

    // SBL
    html += `
      <div class="menu-item" data-key="sbl" onclick="showSection('sbl')" role="button" tabindex="0">
        <i class="fas fa-video"></i>
        <span>SBL</span>
      </div>
    `;

    // ISMS
    html += `
      <div class="menu-item" data-key="isms" onclick="showCategorySection('ISMS')" role="button" tabindex="0">
        <i class="fas fa-shield-alt"></i>
        <span>ISMS</span>
      </div>
    `;

    // Misc
    html += `
      <div class="menu-item" data-key="misc" onclick="showCategorySection('Misc')" role="button" tabindex="0">
        <i class="fas fa-folder"></i>
        <span>Misc</span>
      </div>
    `;

    // Custom categories
    categories.forEach(cat => {
      const icon = getCategoryIcon(cat);
      html += `
        <div class="menu-item" data-key="${cat.toLowerCase()}" onclick="showCategorySection('${cat.replace(/'/g, "\\'")}')" role="button" tabindex="0">
          <i class="fas ${icon}"></i>
          <span>${cat}</span>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  // ==================== DYNAMIC CATEGORY SECTIONS ====================

  function showCategorySection(categoryName) {
    currentActiveCategory = categoryName;

    // Update sidebar active state
    document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
    const menuItem = document.querySelector(`.menu-item[data-key="${categoryName.toLowerCase()}"]`);
    if (menuItem) menuItem.classList.add('active');

    // Hide all sections and show category section
    document.querySelectorAll('.section').forEach(section => section.classList.remove('active'));
    const categorySection = document.getElementById('categorySection');
    if (categorySection) categorySection.classList.add('active');

    // Update section header
    const icon = getCategoryIcon(categoryName);
    document.getElementById('categorySectionTitle').innerHTML = `<i class="fas ${icon}"></i> ${categoryName} Training`;

    // Load sub-section based on user type
    const userType = (currentUser?.type || '').toLowerCase().trim();
    if (userType === 'trainee') {
      showCategorySubSection('progress', categoryName);
    } else {
      showCategorySubSection('dashboard', categoryName);
    }
  }

  function showCategorySubSection(subSection, categoryName) {
    categoryName = categoryName || currentActiveCategory;
    if (!categoryName) return;

    // Update sub-nav active state
    document.querySelectorAll('#categorySection .sub-nav-item').forEach(tab => tab.classList.remove('active'));
    const activeTab = document.getElementById('category' + capitalizeFirst(subSection) + 'Tab');
    if (activeTab) activeTab.classList.add('active');

    const contentDiv = document.getElementById('categorySectionContent');
    contentDiv.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>';

    const userType = (currentUser?.type || '').toLowerCase().trim();

    switch (subSection) {
      case 'dashboard':
        loadCategoryDashboard(categoryName);
        break;
      case 'progress':
        if (userType === 'trainee') {
          loadCategoryTraineeProgress(categoryName);
        } else {
          loadCategoryTrainerProgress(categoryName);
        }
        break;
      case 'evaluations':
        if (userType === 'trainee') {
          loadTraineeQuizzes(categoryName);
        } else {
          loadTrainerQuizManagement(categoryName);
        }
        break;
      case 'reports':
        if (userType === 'trainer') {
          loadQuizTestReports(categoryName);
        } else {
          loadCategoryReports(categoryName);
        }
        break;
    }
  }

  function loadCategoryDashboard(categoryName) {
    google.script.run
      .withSuccessHandler(function(data) {
        renderCategoryDashboard(categoryName, data);
      })
      .withFailureHandler(function(error) {
        document.getElementById('categorySectionContent').innerHTML =
          '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Error</h3><p>' + error.message + '</p></div>';
      })
      .getCategoryDashboardData(categoryName);
  }

  function renderCategoryDashboard(categoryName, data) {
    const content = document.getElementById('categorySectionContent');
    const icon = getCategoryIcon(categoryName);

    content.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon blue"><i class="fas ${icon}"></i></div>
          <div class="stat-info"><h3>${data.totalTrainings || 0}</h3><p>Total Trainings</p></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green"><i class="fas fa-users"></i></div>
          <div class="stat-info"><h3>${data.totalTrainees || 0}</h3><p>Total Trainees</p></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon yellow"><i class="fas fa-calendar-check"></i></div>
          <div class="stat-info"><h3>${data.upcomingTrainings || 0}</h3><p>Upcoming</p></div>
        </div>
      </div>

      ${data.recentTrainings && data.recentTrainings.length > 0 ? `
        <div class="data-table-container">
          <table class="data-table">
            <thead><tr><th>Batch</th><th>Application</th><th>Start Date</th><th>End Date</th><th>Status</th></tr></thead>
            <tbody>
              ${data.recentTrainings.map(t => `
                <tr>
                  <td>${t.batch || '-'}</td>
                  <td>${t.application || '-'}</td>
                  <td>${t.startDate || '-'}</td>
                  <td>${t.endDate || '-'}</td>
                  <td><span class="status-badge ${(t.status || 'scheduled').toLowerCase().replace(' ', '-')}">${t.status || 'Scheduled'}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      ` : `<div class="empty-state"><i class="fas ${icon}"></i><h3>No ${categoryName} Trainings</h3><p>No training sessions found for this category.</p></div>`}
    `;
  }

  function loadCategoryTraineeProgress(categoryName) {
    const content = document.getElementById('categorySectionContent');
    content.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading your progress...</p></div>';

    google.script.run
      .withSuccessHandler(function(data) {
        renderCategoryTraineeProgress(categoryName, data);
      })
      .withFailureHandler(function(error) {
        content.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Error</h3><p>' + error.message + '</p></div>';
      })
      .getCategoryTraineeProgressSummary(currentUser ? currentUser.email : '', categoryName);
  }

  function renderCategoryTraineeProgress(categoryName, data) {
    const content = document.getElementById('categorySectionContent');
    const icon = getCategoryIcon(categoryName);

    if (!data || !data.trainings || data.trainings.length === 0) {
      content.innerHTML = `
        <div class="empty-state">
          <i class="fas ${icon}"></i>
          <h3>No Training Progress</h3>
          <p>You don't have any ${categoryName} training progress to display yet.</p>
        </div>
      `;
      return;
    }

    content.innerHTML = `
      <div class="progress-header">
        <h3><i class="fas fa-chart-line"></i> My ${categoryName} Training Progress</h3>
        <p>Click any training to view day-wise progress</p>
      </div>

      <div class="trainee-progress-grid">
        ${data.trainings.map(t => `
          <div class="training-progress-card" onclick="viewCategoryTraineeDetailedProgress('${t.batch}', '${t.application.replace(/'/g, "\\'")}', '${categoryName.replace(/'/g, "\\'")}')">
            <div class="training-card-header">
              <h4>${t.application}</h4>
              <span class="batch-badge">Batch: ${t.batch}</span>
            </div>
            <div class="training-card-body">
              <div class="training-card-info" style="width:100%">
                <p><i class="fas fa-layer-group"></i> Level: ${t.level || 'N/A'}</p>
                <p><i class="fas fa-calendar-alt"></i> ${t.startDate} - ${t.endDate}</p>
                <p><i class="fas fa-tasks"></i> ${t.completedTopics}/${t.totalTopics} topics completed</p>
                <p><i class="fas fa-percent"></i> Progress: <strong>${t.progressPercent}%</strong></p>
              </div>
            </div>
            <div class="training-card-footer">
              <button class="btn btn-sm btn-outline"><i class="fas fa-eye"></i> View Details</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function viewCategoryTraineeDetailedProgress(batch, application, categoryName) {
    const content = document.getElementById('categorySectionContent');
    content.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading progress details...</p></div>';

    google.script.run
      .withSuccessHandler(function(data) {
        renderCategoryTraineeDetailedProgress(batch, application, categoryName, data);
      })
      .withFailureHandler(function(error) {
        content.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Error</h3><p>' + error.message + '</p></div>';
      })
      .getTraineeProgress(currentUser ? currentUser.email : '', application, batch);
  }

  function renderCategoryTraineeDetailedProgress(batch, application, categoryName, data) {
    const content = document.getElementById('categorySectionContent');

    const dayGroups = {};
    (data.progress || []).forEach(p => {
      if (!dayGroups[p.day]) dayGroups[p.day] = [];
      dayGroups[p.day].push(p);
    });

    const sortedDays = Object.keys(dayGroups).sort((a, b) => {
      const numA = parseInt(String(a).replace(/\D/g, ''), 10) || 0;
      const numB = parseInt(String(b).replace(/\D/g, ''), 10) || 0;
      return numA - numB;
    });

    content.innerHTML = `
      <div class="progress-detail-header">
        <button class="btn btn-sm btn-outline" onclick="showCategorySubSection('progress', '${categoryName.replace(/'/g, "\\'")}')">
          <i class="fas fa-arrow-left"></i> Back to Summary
        </button>
        <div class="progress-info">
          <h3>${application}</h3>
          <p>Batch: ${batch}</p>
        </div>
      </div>

      <div class="day-wise-progress">
        ${sortedDays.map(day => {
          const topics = dayGroups[day];
          const completed = topics.filter(t => t.status === 'Done').length;
          const total = topics.length;
          const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

          return `
            <div class="day-progress-card">
              <div class="day-header" onclick="toggleDayDetails(this)">
                <div class="day-info">
                  <h4><i class="fas fa-calendar-day"></i> ${day}</h4>
                  <span class="day-stats">${completed}/${total} topics completed</span>
                </div>
                <div class="day-progress-bar">
                  <div class="progress-fill" style="width:${percent}%"></div>
                </div>
                <span class="day-percent">${percent}%</span>
                <i class="fas fa-chevron-down toggle-icon"></i>
              </div>

              <div class="day-topics" style="display:none;">
                ${topics.map(t => `
                  <div class="topic-item ${t.status === 'Done' ? 'completed' : ''}">
                    <div class="topic-status">
                      ${t.status === 'Done'
                        ? '<i class="fas fa-check-circle" style="color:var(--secondary-color)"></i>'
                        : '<i class="far fa-circle" style="color:var(--light-gray)"></i>'}
                    </div>
                    <div class="topic-info">
                      <span class="topic-name">${t.topic}</span>
                      ${t.markedDate ? `<span class="topic-date">Completed on ${t.markedDate}</span>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function toggleDayDetails(header) {
    const topics = header.nextElementSibling;
    const icon = header.querySelector('.toggle-icon');
    
    if (topics.style.display === 'none') {
      topics.style.display = 'block';
      icon.classList.remove('fa-chevron-down');
      icon.classList.add('fa-chevron-up');
    } else {
      topics.style.display = 'none';
      icon.classList.remove('fa-chevron-up');
      icon.classList.add('fa-chevron-down');
    }
  }

  function loadCategoryTrainerProgress(categoryName) {
    const content = document.getElementById('categorySectionContent');
    content.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading trainings...</p></div>';

    Promise.all([
      new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getCategoryApplications(categoryName);
      }),
      new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).getCategoryTrainees(categoryName);
      })
    ]).then(([applications, trainees]) => {
      renderCategoryTrainerProgressView(categoryName, applications, trainees);
      loadCategoryTrainingsWithFilters(categoryName);
    }).catch(error => {
      content.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Error</h3><p>' + error.message + '</p></div>';
    });
  }

  function renderCategoryTrainerProgressView(categoryName, applications, trainees) {
    const content = document.getElementById('categorySectionContent');
    const icon = getCategoryIcon(categoryName);

    content.innerHTML = `
      <div class="trainer-progress-container">
        <div class="progress-header">
          <h3><i class="fas fa-tasks"></i> ${categoryName} Training Progress Management</h3>
          <p>Filter trainings and mark topic completion</p>
        </div>

        <div class="filters-section">
          <div class="filter-row">
            <div class="filter-group">
              <label><i class="fas fa-user"></i> Trainee Name</label>
              <select id="filterCategoryTraineeName" onchange="loadCategoryTrainingsWithFilters('${categoryName.replace(/'/g, "\\'")}')">
                <option value="">All Trainees</option>
                ${(trainees || []).map(t => `<option value="${t.name}">${t.name}</option>`).join('')}
              </select>
            </div>

            <div class="filter-group">
              <label><i class="fas fa-laptop"></i> Application</label>
              <select id="filterCategoryApplication" onchange="loadCategoryTrainingsWithFilters('${categoryName.replace(/'/g, "\\'")}')">
                <option value="">All Applications</option>
                ${(applications || []).map(a => `<option value="${a}">${a}</option>`).join('')}
              </select>
            </div>

            <div class="filter-group">
              <label><i class="fas fa-calendar"></i> Start Date</label>
              <input type="date" id="filterCategoryStartDate" onchange="loadCategoryTrainingsWithFilters('${categoryName.replace(/'/g, "\\'")}')">
            </div>

            <div class="filter-group">
              <label><i class="fas fa-calendar"></i> End Date</label>
              <input type="date" id="filterCategoryEndDate" onchange="loadCategoryTrainingsWithFilters('${categoryName.replace(/'/g, "\\'")}')">
            </div>

            <div class="filter-group filter-actions">
              <button class="btn btn-sm btn-outline" onclick="clearCategoryProgressFilters('${categoryName.replace(/'/g, "\\'")}')">

      dayGroups[p.day].push(p);
    });

    const sortedDays = Object.keys(dayGroups).sort((a, b) => {
      const numA = parseInt(String(a).replace(/\D/g, ''), 10) || 0;
      const numB = parseInt(String(b).replace(/\D/g, ''), 10) || 0;
      return numA - numB;
    });

    container.innerHTML = `

        <div class="progress-detail-header">
          <button class="btn btn-sm btn-outline" onclick="loadCategoryTrainingsWithFilters('${categoryName.replace(/'/g, "\\'")}')">

  function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    const monthLabel = document.getElementById('calendarMonthLabel');
    const jumpMonth = document.getElementById('jumpMonth');
    const jumpYear = document.getElementById('jumpYear');

    const year = currentCalendarDate.getFullYear();
    const month = currentCalendarDate.getMonth();

    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'];

    monthLabel.textContent = `${monthNames[month]} ${year}`;
    jumpMonth.value = month;
    jumpYear.value = year;

    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startDayOfWeek = firstDay.getDay();
    const daysInMonth = lastDay.getDate();

    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

    let html = '';

    // Empty cells before first day
    for (let i = 0; i < startDayOfWeek; i++) {
      html += '<div class="calendar-day empty"></div>';
    }

    // Days of month
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const isToday = dateStr === todayStr;
      const dayEvents = getEventsForDate(dateStr);

      html += `<div class="calendar-day${isToday ? ' today' : ''}${dayEvents.length > 0 ? ' has-events' : ''}" onclick="showDayEvents('${dateStr}')">`;
      html += `<span class="day-number">${day}</span>`;

      if (dayEvents.length > 0) {
        html += '<div class="day-events">';
        dayEvents.slice(0, 3).forEach(event => {
          const categoryClass = (event.category || 'misc').toLowerCase();
          html += `<div class="event-dot ${categoryClass}" title="${event.application}"></div>`;
        });
        if (dayEvents.length > 3) {
          html += `<span class="more-events">+${dayEvents.length - 3}</span>`;
        }
        html += '</div>';
      }

      html += '</div>';
    }

    grid.innerHTML = html;
  }

  function getEventsForDate(dateStr) {
    return calendarEvents.filter(event => {
      const start = new Date(event.startDate);
      const end = new Date(event.endDate);
      const check = new Date(dateStr);
      return check >= start && check <= end;
    });
  }

  function changeCalendarMonth(delta) {
    currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
    renderCalendar();

      formStep.classList.toggle('active', index === step - 1);
    });

    document.getElementById('prevStepBtn').classList.toggle('btn-hidden', step === 1);
    document.getElementById('nextStepBtn').classList.toggle('btn-hidden', step === 3);
    document.getElementById('saveTrainingBtn').classList.toggle('btn-hidden', step !== 3);
  }

  function nextTrainingStep() {
    if (currentTrainingStep < 3) {
      showTrainingStep(currentTrainingStep + 1);
    }
  }

  function prevTrainingStep() {
    if (currentTrainingStep > 1) {
      showTrainingStep(currentTrainingStep - 1);
    }
  }

  function addChip(value, storeKey, containerId) {
    if (!value || trainingStore[storeKey].includes(value)) return;

    trainingStore[storeKey].push(value);

    const container = document.getElementById(containerId);
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `
      ${value}
      <button type="button" onclick="removeChip('${value.replace(/'/g, "\\'")}', '${storeKey}', this)">
        <i class="fas fa-times"></i>
      </button>
    `;
    container.appendChild(chip);
    validateTrainingForm();
  }

  function addApplication() {
    const select = document.getElementById('appInput');
    const value = select.value;
    if (value) {
      addChip(value, 'applications', 'applicationChips');
      select.value = '';
    }
  }

  function addLevel(level) {
    addChip(level, 'levels', 'levelChips');
  }

  function removeChip(value, storeKey, btn) {
    trainingStore[storeKey] = trainingStore[storeKey].filter(v => v !== value);
    btn.closest('.chip').remove();
    validateTrainingForm();
  }

  function addTrainee() {
    const nameInput = document.getElementById('traineeNameInput');
    const emailInput = document.getElementById('traineeEmailInput');

    const name = nameInput.value.trim();
    const email = emailInput.value.trim().toLowerCase();

    if (!name || !email) {
      showToast('Please enter both name and email', 'warning');
      return;
    }

    if (trainingStore.traineeEmails.includes(email)) {
      showToast('This email is already added', 'warning');
      return;
    }

    trainingStore.traineeNames.push(name);
    trainingStore.traineeEmails.push(email);

    renderTraineeCard(name, email);

    nameInput.value = '';
    emailInput.value = '';
    document.getElementById('noTraineesMsg').style.display = 'none';
    validateTrainingForm();
  }

  function renderTraineeCard(name, email) {
    const container = document.getElementById('traineesList');
    const card = document.createElement('div');
    card.className = 'trainee-card';
    card.innerHTML = `
      <div class="trainee-info">
        <div class="trainee-avatar">${name.charAt(0).toUpperCase()}</div>
        <div class="trainee-details">
          <h4>${name}</h4>
          <p>${email}</p>
        </div>
      </div>
      <button class="remove-trainee" onclick="removeTrainee('${email}', this)">
        <i class="fas fa-trash"></i>
      </button>
    `;
    container.appendChild(card);
  }

  function removeTrainee(email, btn) {
    const index = trainingStore.traineeEmails.indexOf(email);
    if (index > -1) {
      trainingStore.traineeEmails.splice(index, 1);
      trainingStore.traineeNames.splice(index, 1);
    }
    btn.closest('.trainee-card').remove();

    if (trainingStore.traineeEmails.length === 0) {
      document.getElementById('noTraineesMsg').style.display = 'block';
    }
    validateTrainingForm();
  }

  function validateTrainingForm() {
    const isValid =
      document.getElementById('batchCount').value.trim() !== '' &&
      document.getElementById('trainingCategory').value !== '' &&
      trainingStore.applications.length > 0 &&
      trainingStore.traineeNames.length > 0 &&
      trainingStore.traineeEmails.length > 0 &&
      trainingStore.levels.length > 0 &&
      document.getElementById('trainingStartDate').value !== '' &&
      document.getElementById('trainingEndDate').value !== '';

    document.getElementById('saveTrainingBtn').disabled = !isValid;
    return isValid;
  }

  function saveTraining() {
    if (!validateTrainingForm()) {
      showToast('Please fill in all required fields', 'warning');
      return;
    }

    showLoading(true);

    const trainingData = {
      batchCount: document.getElementById('batchCount').value.trim(),
      category: document.getElementById('trainingCategory').value,
      applications: trainingStore.applications,
      traineeNames: trainingStore.traineeNames,
      traineeEmails: trainingStore.traineeEmails,
      levels: trainingStore.levels,
      startDate: document.getElementById('trainingStartDate').value,
      endDate: document.getElementById('trainingEndDate').value,
      offsetIntermediate: parseInt(document.getElementById('offsetIntermediate').value) || 30,
      offsetAdvanced: parseInt(document.getElementById('offsetAdvanced').value) || 60
    };

    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          // Create progress entries
          google.script.run
            .withSuccessHandler(function() {
              showLoading(false);
              showToast('Training saved successfully!', 'success');
              closeAddTrainingModal();
              loadCalendarEvents();
            })
            .withFailureHandler(function(error) {
              showLoading(false);
              showToast('Training saved but progress entries failed: ' + error.message, 'warning');
              closeAddTrainingModal();
              loadCalendarEvents();
            })
            .createProgressEntries(trainingData);
        } else {
          showLoading(false);
          showToast(result.message || 'Failed to save training', 'error');
        }
      })
      .withFailureHandler(function(error) {
        showLoading(false);
        showToast('Failed to save training: ' + error.message, 'error');
      })
      .saveTrainingData(trainingData);
  }

  // ==================== ILT SECTION ====================

  function loadILTSection() {
    const tabs = ['dashboard', 'progress', 'evaluations', 'reports'];
    let firstVisibleTab = 'dashboard';

    if (userPermissions && userPermissions.ilt) {
      for (const tab of tabs) {
        if (userPermissions.ilt[tab]) { firstVisibleTab = tab; break; }
      }
    }
    showILTSubSection(firstVisibleTab);
  }

  function showILTSubSection(subSection) {
    document.querySelectorAll('#iltSection .sub-nav-item').forEach(tab => tab.classList.remove('active'));
    const activeTab = document.getElementById('ilt' + capitalizeFirst(subSection) + 'Tab');
    if (activeTab) activeTab.classList.add('active');

    const contentDiv = document.getElementById('iltContent');
    contentDiv.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>';

    const userType = (currentUser?.type || '').toLowerCase().trim();

    switch (subSection) {
      case 'dashboard': loadILTDashboard(); break;
      case 'progress':
        if (userType === 'trainee') {
          loadTraineeProgressView();
        } else {
          loadTrainerProgressView();
        }
        break;
      case 'evaluations':
        if (userType === 'trainee') {
          loadTraineeQuizzesILT();
        } else {
          loadTrainerQuizManagementILT();
        }
        break;
      case 'reports':
        if (userType === 'trainer') {
          loadQuizTestReportsILT();
        } else {
          loadILTReports();
        }
        break;
    }
  }

  function viewTraineeDetailedProgress(batch, application) {
    const content = document.getElementById('iltContent');
    content.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading progress details...</p></div>';

    google.script.run
      .withSuccessHandler(function(data) {
        renderTraineeDetailedProgress(batch, application, data);
      })
      .withFailureHandler(function(error) {
        content.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Error</h3><p>' + error.message + '</p></div>';
      })
      .getTraineeProgress(currentUser ? currentUser.email : '', application, batch);
  }

  function renderTraineeDetailedProgress(batch, application, data) {
    const content = document.getElementById('iltContent');

    const dayGroups = {};
    (data.progress || []).forEach(p => {
      if (!dayGroups[p.day]) dayGroups[p.day] = [];
      dayGroups[p.day].push(p);
    });

    const sortedDays = Object.keys(dayGroups).sort((a, b) => {
      const numA = parseInt(String(a).replace(/\D/g, ''), 10) || 0;
      const numB = parseInt(String(b).replace(/\D/g, ''), 10) || 0;
      return numA - numB;
    });

    content.innerHTML = `
      <div class="progress-detail-header">
        <button class="btn btn-sm btn-outline" onclick="loadTraineeProgressView()">
          <i class="fas fa-arrow-left"></i> Back to Summary
        </button>
        <div class="progress-info">
          <h3>${application}</h3>
          <p>Batch: ${batch}</p>
        </div>
      </div>

      <div class="day-wise-progress">
        ${sortedDays.map(day => {
          const topics = dayGroups[day];
          const completed = topics.filter(t => t.status === 'Done').length;
          const total = topics.length;
          const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

          return `
            <div class="day-progress-card">
              <div class="day-header" onclick="toggleDayDetails(this)">
                <div class="day-info">
                  <h4><i class="fas fa-calendar-day"></i> ${day}</h4>
                  <span class="day-stats">${completed}/${total} topics completed</span>
                </div>
                <div class="day-progress-bar">
                  <div class="progress-fill" style="width:${percent}%"></div>
                </div>
                <span class="day-percent">${percent}%</span>
                <i class="fas fa-chevron-down toggle-icon"></i>
              </div>

              <div class="day-topics" style="display:none;">
                ${topics.map(t => `
                  <div class="topic-item ${t.status === 'Done' ? 'completed' : ''}">
                    <div class="topic-status">
                      ${t.status === 'Done'
                        ? '<i class="fas fa-check-circle" style="color:var(--secondary-color)"></i>'
                        : '<i class="far fa-circle" style="color:var(--light-gray)"></i>'}
                    </div>
                    <div class="topic-info">
                      <span class="topic-name">${t.topic}</span>
                      ${t.markedDate ? `<span class="topic-date">Completed on ${t.markedDate}</span>` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function renderTraineeSelectionList(trainees) {
    const container = document.getElementById('traineeSelectionList');
    
    if (!trainees || trainees.length === 0) {
      container.innerHTML = '<p style="color: var(--gray-color); text-align: center;">No trainees found</p>';
      return;
    }
    
    container.innerHTML = `
      <div class="trainee-selection-header">
        <label class="checkbox-label">
          <input type="checkbox" id="selectAllTrainees" onchange="toggleSelectAllTrainees(this)">
          <span>Select All (${trainees.length})</span>
        </label>
      </div>
      <div class="trainee-checkbox-list">
        ${trainees.map(t => `
          <label class="trainee-checkbox-item">
            <input type="checkbox" value="${t.email}" data-name="${t.name}" onchange="onTraineeCheckboxChange(this)">
            <span class="trainee-checkbox-info">
              <strong>${t.name}</strong>
              <small>${t.email}</small>
            </span>
          </label>
        `).join('')}
      </div>
    `;
  }

  function toggleSelectAllTrainees(checkbox) {
    const checkboxes = document.querySelectorAll('.trainee-checkbox-list input[type="checkbox"]');
    selectedQuizTrainees = [];
    
    checkboxes.forEach(cb => {
      cb.checked = checkbox.checked;
      if (checkbox.checked) {
        selectedQuizTrainees.push(cb.value);
      }
    });
    
    updateSelectedTraineesCount();
  }

  function onTraineeCheckboxChange(checkbox) {
    if (checkbox.checked) {
      if (!selectedQuizTrainees.includes(checkbox.value)) {
        selectedQuizTrainees.push(checkbox.value);
      }
    } else {
      selectedQuizTrainees = selectedQuizTrainees.filter(e => e !== checkbox.value);
    }
    
    updateSelectedTraineesCount();
  }

  function updateSelectedTraineesCount() {
    const countEl = document.getElementById('selectedTraineesCount');
    if (countEl) {
      countEl.textContent = `${selectedQuizTrainees.length} trainee(s) selected`;
    }
  }

  function assignQuiz() {
    const application = document.getElementById('quizApplicationSelect').value;
    const testNumber = document.getElementById('quizTestNumberSelect').value;
    const batch = document.getElementById('quizBatchSelect').value;
    const dueDate = document.getElementById('quizDueDate').value;
    
    if (!application) {
      showToast('Please select an application', 'warning');
      return;
    }
    
    if (!testNumber) {
      showToast('Please select a test number', 'warning');
      return;
    }
    
    if (selectedQuizTrainees.length === 0) {
      showToast('Please select at least one trainee', 'warning');
      return;
    }
    
    showLoading(true);
    
    const assignmentData = {
      application: application,
      testNumber: testNumber,
      batch: batch,
      traineeEmails: selectedQuizTrainees,
      assignedBy: currentUser?.email || '',
      dueDate: dueDate
    };
    
    google.script.run
      .withSuccessHandler(function(result) {

  function startQuiz(assignmentId, application, testNumber) {
    showLoading(true);
    
    google.script.run
      .withSuccessHandler(function(data) {
        showLoading(false);
        // FIXED: Check for success flag from backend
        if (data && data.success && data.questions && data.questions.length > 0) {
          currentQuizData = {
            assignmentId: assignmentId,
            application: application,
            testNumber: testNumber,
            questions: data.questions,
            currentIndex: 0,
            answers: {}
          };
          showQuizInterface();
        } else {
          // Show specific error message from backend or default message
          const errorMsg = (data && data.message) ? data.message : 'Failed to load quiz. No questions found for this quiz.';
          showToast(errorMsg, 'error');
        }
      })
      .withFailureHandler(function(error) {
        showLoading(false);
        showToast('Error loading quiz: ' + error.message, 'error');
      })
      .getQuizQuestions(application, testNumber);
  }

  function showQuizInterface() {
    document.getElementById('quizTakingModal').classList.add('active');
    
    // Set quiz info
    document.getElementById('quizInfoTitle').textContent = `${currentQuizData.application} - ${currentQuizData.testNumber}`;
    document.getElementById('quizTotalQuestions').textContent = currentQuizData.questions.length;
    
    // Start timer
    quizStartTime = new Date();
    startQuizTimer();
    
    // Render navigation dots
    renderQuizNavigationDots();
    
    // Show first question
    showQuizQuestion(0);
  }

  function startQuizTimer() {
    if (quizTimerInterval) clearInterval(quizTimerInterval);
    
    quizTimerInterval = setInterval(function() {
      const elapsed = Math.floor((new Date() - quizStartTime) / 1000);
      const minutes = Math.floor(elapsed / 60);
      const seconds = elapsed % 60;
      document.getElementById('quizTimer').textContent = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }, 1000);
  }

  function renderQuizNavigationDots() {
    const container = document.getElementById('quizNavigationDots');
    container.innerHTML = currentQuizData.questions.map((q, i) => `
      <div class="quiz-nav-dot ${i === 0 ? 'active' : ''} ${currentQuizData.answers[i] !== undefined ? 'answered' : ''}" 
           onclick="showQuizQuestion(${i})">${i + 1}</div>
    `).join('');
  }

  function showQuizQuestion(index) {
    currentQuizData.currentIndex = index;
    const question = currentQuizData.questions[index];
    
    document.getElementById('quizCurrentQuestion').textContent = index + 1;
    
    const container = document.getElementById('quizQuestionContainer');
    container.innerHTML = `
      <div class="quiz-question">
        <h3 class="question-text">${question.question}</h3>
        <div class="quiz-options">
          ${['A', 'B', 'C', 'D'].map(opt => `
            <label class="quiz-option ${currentQuizData.answers[index] === opt ? 'selected' : ''}">
              <input type="radio" name="quizAnswer" value="${opt}" 
                ${currentQuizData.answers[index] === opt ? 'checked' : ''}
                onchange="selectQuizAnswer('${opt}')">
              <span class="option-letter">${opt}</span>
              <span class="option-text">${question['option' + opt] || ''}</span>
            </label>
          `).join('')}
        </div>
      </div>
    `;
    
    // Update navigation dots
    document.querySelectorAll('.quiz-nav-dot').forEach((dot, i) => {
      dot.classList.toggle('active', i === index);
      dot.classList.toggle('answered', currentQuizData.answers[i] !== undefined);
    });
    
    // Update prev/next buttons
    document.getElementById('quizPrevBtn').disabled = index === 0;
    document.getElementById('quizNextBtn').classList.toggle('btn-hidden', index === currentQuizData.questions.length - 1);
    document.getElementById('quizSubmitBtn').classList.toggle('btn-hidden', index !== currentQuizData.questions.length - 1);
  }

  function selectQuizAnswer(answer) {
    currentQuizData.answers[currentQuizData.currentIndex] = answer;
    
    // Update option styling
    document.querySelectorAll('.quiz-option').forEach(opt => {
      opt.classList.toggle('selected', opt.querySelector('input').value === answer);
    });
    
    // Update navigation dot
    renderQuizNavigationDots();
    showQuizQuestion(currentQuizData.currentIndex);
  }

  function prevQuizQuestion() {
    if (currentQuizData.currentIndex > 0) {
      showQuizQuestion(currentQuizData.currentIndex - 1);
    }
  }

  function nextQuizQuestion() {
    if (currentQuizData.currentIndex < currentQuizData.questions.length - 1) {
      showQuizQuestion(currentQuizData.currentIndex + 1);
    }
  }

  function submitQuiz() {
    // Check if all questions are answered
    const unanswered = currentQuizData.questions.length - Object.keys(currentQuizData.answers).length;
    
    if (unanswered > 0) {
      if (!confirm(`You have ${unanswered} unanswered question(s). Are you sure you want to submit?`)) {
        return;
      }
    }
    
    // Stop timer
    if (quizTimerInterval) {
      clearInterval(quizTimerInterval);
      quizTimerInterval = null;
    }
    
    const timeTaken = Math.floor((new Date() - quizStartTime) / 1000);
    
    showLoading(true);
    
    const submissionData = {
      assignmentId: currentQuizData.assignmentId,
      application: currentQuizData.application,
      testNumber: currentQuizData.testNumber,
      traineeEmail: currentUser?.email || '',
      traineeName: currentUser?.name || '',
      answers: currentQuizData.answers,
      timeTaken: timeTaken
    };
    
    google.script.run
      .withSuccessHandler(function(result) {
        showLoading(false);
        if (result.success) {
          closeQuizTakingModal();
          showQuizResults(result);
        } else {
          showToast(result.message || 'Failed to submit quiz', 'error');
        }
      })
      .withFailureHandler(function(error) {
        showLoading(false);
        showToast('Error: ' + error.message, 'error');
      })
      .submitQuizAnswers(submissionData);
  }

  function closeQuizTakingModal() {
    if (quizTimerInterval) {
      clearInterval(quizTimerInterval);
      quizTimerInterval = null;
    }
    document.getElementById('quizTakingModal').classList.remove('active');
    currentQuizData = null;
  }

  function showQuizResults(result) {
    document.getElementById('quizResultsModal').classList.add('active');
    
    const scorePercent = result.scorePercent || 0;
    const passed = scorePercent >= 70;
    
    document.getElementById('quizResultScore').textContent = `${result.correctCount}/${result.totalQuestions}`;
    document.getElementById('quizResultPercent').textContent = `${scorePercent}%`;
    document.getElementById('quizResultPercent').className = `result-percent ${passed ? 'passed' : 'failed'}`;
    document.getElementById('quizResultStatus').textContent = passed ? 'PASSED' : 'FAILED';
    document.getElementById('quizResultStatus').className = `result-status ${passed ? 'passed' : 'failed'}`;
    
    // Show detailed results
    const detailsContainer = document.getElementById('quizResultDetails');
    detailsContainer.innerHTML = result.details.map((d, i) => `
      <div class="result-item ${d.isCorrect ? 'correct' : 'incorrect'}">
        <div class="result-question">
          <span class="question-number">Q${i + 1}.</span>
          <span class="question-text">${d.question}</span>
        </div>
        <div class="result-answer">
          <span class="your-answer">Your Answer: <strong>${d.yourAnswer || 'Not answered'}</strong></span>
          ${!d.isCorrect ? `<span class="correct-answer">Correct: <strong>${d.correctAnswer}</strong></span>` : ''}
          <span class="result-icon">${d.isCorrect ? '<i class="fas fa-check-circle" style="color: var(--secondary-color);"></i>' : '<i class="fas fa-times-circle" style="color: var(--danger-color);"></i>'}</span>
        </div>
      </div>
    `).join('');
  }

  function applyReportsFilters(containerId) {
    var batchEl = document.getElementById('reportBatchFilter' + containerId);
    var testEl = document.getElementById('reportTestFilter' + containerId);
    var appEl = document.getElementById('reportAppFilter' + containerId);
    var startEl = document.getElementById('reportStartDate' + containerId);
    var endEl = document.getElementById('reportEndDate' + containerId);
    
    var batch = batchEl ? batchEl.value : '';
    var testNumber = testEl ? testEl.value : '';
    var application = appEl ? appEl.value : '';
    var startDate = startEl ? startEl.value : '';
    var endDate = endEl ? endEl.value : '';
    
    // Update filter state
    reportsFilterState = { 
      batch: batch, 
      testNumber: testNumber, 
      application: application, 
      startDate: startDate, 
      endDate: endDate 
    };
    
    // Show loading in table container
    var tableContainer = document.getElementById('reportsTableContainer' + containerId);
    if (tableContainer) {
      tableContainer.innerHTML = '<div class="loading" style="padding: 40px; text-align: center;"><i class="fas fa-spinner fa-spin" style="font-size: 24px; color: var(--primary-color);"></i><p>Applying filters...</p></div>';
    }
    
    // Call backend with filters
    google.script.run
      .withSuccessHandler(function(data) {
        // Update tiles
        var tiles = data.tiles || { totalEvaluations: 0, totalPassed: 0, totalFailed: 0 };
        var totalEvalEl = document.getElementById('tileTotalEvaluations');
        var totalPassEl = document.getElementById('tileTotalPassed');
        var totalFailEl = document.getElementById('tileTotalFailed');
        
        if (totalEvalEl) totalEvalEl.textContent = tiles.totalEvaluations;
        if (totalPassEl) totalPassEl.textContent = tiles.totalPassed;
        if (totalFailEl) totalFailEl.textContent = tiles.totalFailed;
        
        // Update table
        if (tableContainer) {
          tableContainer.innerHTML = renderReportsTable(data.reports || [], containerId);
        }
        
        // Update certifications count
        var certCountEl = document.getElementById('tileTotalCertifications');
        if (certCountEl && data.tiles) {
          certCountEl.textContent = data.tiles.totalCertifications || 0;
        }
        
        // Update certifications table
        var certContainer = document.getElementById('certificationsTableContainer' + containerId);
        if (certContainer && data.certifications) {
          certContainer.innerHTML = renderCertificationsTable(data.certifications, containerId);
          window['certificationsData_' + containerId] = data.certifications;
        }
      })
      .withFailureHandler(function(error) {
        if (tableContainer) {
          tableContainer.innerHTML = '<div class="empty-state" style="padding: 40px; text-align: center;"><i class="fas fa-exclamation-circle" style="font-size: 48px; color: var(--danger-color); margin-bottom: 15px;"></i><h3>Error</h3><p>' + error.message + '</p></div>';
        }
      })
      .getReportsAndCertificationData(reportsFilterState);
  }

  function clearReportsFilters(containerId) {
    // Clear all filter inputs
    var batchEl = document.getElementById('reportBatchFilter' + containerId);
    var testEl = document.getElementById('reportTestFilter' + containerId);
    var appEl = document.getElementById('reportAppFilter' + containerId);
    var startEl = document.getElementById('reportStartDate' + containerId);
    var endEl = document.getElementById('reportEndDate' + containerId);
    
    if (batchEl) batchEl.value = '';
    if (testEl) testEl.value = '';
    if (appEl) appEl.value = '';
    if (startEl) startEl.value = '';
    if (endEl) endEl.value = '';
    
    // Reset filter state and reload
    reportsFilterState = { batch: '', testNumber: '', application: '', startDate: '', endDate: '' };
    applyReportsFilters(containerId);
  }

  function renderQuizResults(data, containerId, scoreFilter) {
    const container = document.getElementById(containerId);
    
    let results = data.results || [];
    
    // Apply score filter
    if (scoreFilter === 'passed') {
      results = results.filter(r => r.scorePercent >= 70);
    } else if (scoreFilter === 'failed') {
      results = results.filter(r => r.scorePercent < 70);
    }
    
    if (results.length === 0) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-clipboard-list"></i><h3>No Results</h3><p>No quiz results found for the selected criteria.</p></div>';
      return;
    }
    
    container.innerHTML = `

        <table class="data-table">
          <thead>
            <tr>
              <th>Batch</th>
              <th>Trainee</th>
              <th>Application</th>
              <th>Test</th>
              <th>Score</th>
              <th>Time Taken</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${results.map(r => `
              <tr>
                <td>${r.batch || '-'}</td>
                <td>${r.traineeName}<br><small>${r.traineeEmail}</small></td>
                <td>${r.application}</td>
                <td>${r.testNumber}</td>
                <td><strong>${r.correctCount}/${r.totalQuestions}</strong> (${r.scorePercent}%)</td>
                <td>${formatTime(r.timeTaken)}</td>
                <td>${r.submittedDate}</td>
                <td><span class="status-badge ${r.scorePercent >= 70 ? 'passed' : 'failed'}">${r.scorePercent >= 70 ? 'Passed' : 'Failed'}</span></td>

                    <i class="fas fa-eye"></i> View

      </div>

  function formatTime(seconds) {
    if (!seconds) return '-';
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}m ${secs}s`;
  }

  function downloadCSV(content, filename) {

    link.download = filename;
    link.click();

        const select = document.getElementById('certApplicationSelect');
        select.innerHTML = '<option value="">Select Application</option>' +
          (opts.applications || []).map(a => '<option value="' + a + '">' + a + '</option>').join('');
      })
      .getDropdownOptions();
  }

  function closeAddCertificationModal() {
    document.getElementById('addCertificationModal').classList.remove('active');
  }

  function onCertEmployeeChange() {
    const select = document.getElementById('certEmployeeSelect');
    const email = select.value;
    document.getElementById('certEmployeeEmail').value = email;
  }

  function generateCertification() {
    const employeeSelect = document.getElementById('certEmployeeSelect');
    const employeeEmail = document.getElementById('certEmployeeEmail').value;
    const employeeName = employeeSelect.options[employeeSelect.selectedIndex]?.getAttribute('data-name') || '';
    const batchNumber = document.getElementById('certBatchSelect').value;
    const application = document.getElementById('certApplicationSelect').value;
    const issueDate = document.getElementById('certIssueDate').value;
    const expiryDate = document.getElementById('certExpiryDate').value;
    
    if (!employeeEmail) {
      showToast('Please select an employee', 'warning');
      return;
    }
    if (!batchNumber) {
      showToast('Please select a batch number', 'warning');
      return;
    }
    if (!application) {
      showToast('Please select an application', 'warning');
      return;
    }
    if (!issueDate) {
      showToast('Please select issue date', 'warning');
      return;
    }
    if (!expiryDate) {
      showToast('Please select expiry date', 'warning');
      return;
    }
    
    showLoading(true);
    
    const certData = {
      employeeName: employeeName,
      email: employeeEmail,
      batchNumber: batchNumber,
      application: application,
      issueDate: issueDate,
      expiryDate: expiryDate,
      issuedBy: currentUser?.email || ''
    };
    
    google.script.run
      .withSuccessHandler(function(result) {
        showLoading(false);
        if (result.success) {
          showToast('Certificate generated successfully!', 'success');
          closeAddCertificationModal();
          
          // Refresh the reports view
          if (currentActiveCategory) {
            loadQuizTestReports(currentActiveCategory);
          } else {
            loadQuizTestReportsILT();
          }
          
          // Optionally download the certificate immediately
          if (result.certificateId) {
            downloadCertificate(result.certificateId);
          }
        } else {
          showToast(result.message || 'Failed to generate certificate', 'error');
        }
      })
      .withFailureHandler(function(error) {
        showLoading(false);
        showToast('Error: ' + error.message, 'error');
      })
      .generateIndividualCertification(certData);
  }

  function downloadCertificate(certificateId) {
    showLoading(true);
    
    google.script.run
      .withSuccessHandler(function(result) {
        showLoading(false);
        if (result.success && result.htmlContent) {
          // Open certificate in new window for printing/saving
          const printWindow = window.open('', '_blank');
          printWindow.document.write(result.htmlContent);
          printWindow.document.close();
          showToast('Certificate opened in new window', 'success');
        } else {
          showToast(result.message || 'Failed to generate certificate', 'error');
        }
      })
      .withFailureHandler(function(error) {
        showLoading(false);
        showToast('Error: ' + error.message, 'error');
      })
      .getCertificateHTML(certificateId);
  }

  function downloadEvaluationReport(resultId) {
    showLoading(true);
    
    google.script.run
      .withSuccessHandler(function(result) {
        showLoading(false);
        if (result.success && result.htmlContent) {
          // Open report in new window for printing/saving
          const printWindow = window.open('', '_blank');
          printWindow.document.write(result.htmlContent);
          printWindow.document.close();
          showToast('Evaluation report opened in new window', 'success');
        } else {
          showToast(result.message || 'Failed to generate report', 'error');
        }
      })
      .withFailureHandler(function(error) {
        showLoading(false);
        showToast('Error: ' + error.message, 'error');
      })
      .getEvaluationReportHTML(resultId);
  }

  // Initialize on page load
  document.addEventListener('DOMContentLoaded', function() {
    // Any initialization code
  });
</script>
