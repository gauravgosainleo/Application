plugins {
    id 'com.android.application'
}

// Release signing comes either from CI (see .github/workflows/android.yml) as
// environment variables, or locally from an untracked keystore.properties next
// to settings.gradle (storeFile, storePassword, keyAlias, keyPassword). Neither
// the keystore nor its passwords may ever be committed: this repository is
// public, and anyone holding the upload key can ship an update to residents.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String envName, String propName ->
    def fromEnv = System.getenv(envName)
    return fromEnv ? fromEnv : keystoreProps.getProperty(propName)
}
def releaseStoreFile = signingValue('UNINAV_KEYSTORE_FILE', 'storeFile')

android {
    namespace 'net.learninganddevelopment.uninav'
    compileSdk 36

    defaultConfig {
        applicationId "net.learninganddevelopment.uninav"
        minSdk 24
        // Google Play requires API 36 for new apps and updates since 31 Aug 2026.
        targetSdk 36
        // 1.8.0 -> 180. Old side-loaded builds used 1 and 2, so any later
        // release only has to keep counting up from here (1.8.1 -> 181).
        versionCode 180
        versionName "1.8.0"

        // Pulled from gradle.properties so a redeploy needs no code edit.
        buildConfigField "String", "BASE_URL",      "\"${project.property('UNINAV_BASE_URL')}\""
        buildConfigField "String", "APP_HOST",      "\"${project.property('UNINAV_HOST')}\""
        buildConfigField "String", "NOTIFY_KEY",    "\"${project.property('UNINAV_NOTIFY_KEY')}\""
        buildConfigField "long",   "POLL_MINUTES",  "${project.property('UNINAV_POLL_MINUTES')}L"
        // The Play Store listing the update prompt opens. Deliberately not
        // applicationId, so the .debug build still points at the real listing.
        buildConfigField "String", "STORE_PACKAGE", "\"net.learninganddevelopment.uninav\""

        manifestPlaceholders = [uninavHost: project.property('UNINAV_HOST')]
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('UNINAV_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('UNINAV_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('UNINAV_KEY_PASSWORD', 'keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Without signing material the release outputs stay unsigned, which
            // Play rejects; use assembleDebug for a quick installable build.
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // 1.17.0 is the newest core that compiles against API 36; 1.19+ needs
    // compileSdk 37 and AGP 9.1.
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity:1.12.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.work:work-runtime:2.11.2'

    // Instant notifications. Firebase is initialised at runtime from the
    // server's settings (PushManager), so there is no google-services.json in
    // this project and no google-services Gradle plugin.
    implementation platform('com.google.firebase:firebase-bom:35.0.2')
    implementation 'com.google.firebase:firebase-messaging'

    // Lets the update prompt ask Google Play whether a newer version exists.
    implementation 'com.google.android.play:app-update:2.1.0'
}
