name: Android APK and AAB

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Website the app opens (empty = the default in android/app/build.gradle)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Release signing (only when the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Signing the APK and the Play bundle (.aab) with your key."
          else
            echo "::notice::No signing secrets set - the APK is signed with a temporary debug key and no .aab is built (see README)."
          fi

      - name: Build APK (and the Google Play .aab when signing secrets exist)
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          chmod +x gradlew
          tasks="assembleRelease"
          if [ -f keystore.properties ]; then tasks="$tasks bundleRelease"; fi
          if [ -n "$APP_URL" ]; then
            ./gradlew --no-daemon $tasks -PappUrl="$APP_URL"
          else
            ./gradlew --no-daemon $tasks
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/gvi-fan-hub.apk
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab dist/gvi-fan-hub.aab
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: gvi-fan-hub-apk
          path: android/dist/gvi-fan-hub.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: hashFiles('android/dist/gvi-fan-hub.aab') != ''
        with:
          name: gvi-fan-hub-aab
          path: android/dist/gvi-fan-hub.aab
