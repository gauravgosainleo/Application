org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Deployment settings. Change these and nothing else to point the app at a
# different installation.
#
# UNINAV_BASE_URL must be https:// - the app refuses cleartext by design, which
# is one of the items START-HERE-SECURITY-UPGRADE.md requires for CERT-In
# closure ("set cleartextTrafficPermitted/usesCleartextTraffic to false").
# ---------------------------------------------------------------------------
UNINAV_BASE_URL=https://learninganddevelopment.net/Uninav/Application
UNINAV_HOST=learninganddevelopment.net

# Must match APP_NOTIFY_KEY in includes/helpers.php (or config/config.php).
# This key is shipped inside the APK and so is extractable - that is why the
# server only ever returns generic "tap to view" text for it and never
# resident data. Rotate it on both sides together if you reissue the app.
UNINAV_NOTIFY_KEY=uv-notify-7c3e9a1b4d2f

# How often Android checks for updates while instant (Firebase) push is not
# active, in minutes. 15 is the platform minimum for periodic work; the OS may
# still batch it later to save battery. Once push is active the check drops to
# hourly and only acts as a safety net.
UNINAV_POLL_MINUTES=15
