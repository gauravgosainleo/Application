name: Android build

# Builds the Uni-Vishwas Android app from android/.
#  - Always: a debug APK for testing (package ...uninav.debug, installs next
#    to the Play version).
#  - When the four signing secrets are set: the signed release AAB to upload
#    to Google Play, plus a signed release APK.
#
# Run it from the Actions tab ("Android build" -> "Run workflow"), or push a
# change under android/ to main. Secrets (Settings -> Secrets and variables ->
# Actions): UNINAV_KEYSTORE_BASE64 (base64 -w0 uninav-upload.jks),
# UNINAV_KEYSTORE_PASSWORD, UNINAV_KEY_ALIAS, UNINAV_KEY_PASSWORD.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uni-vishwas-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Step outputs, not env, decide the release steps: a step-level env
      # value is not visible to another step's "if".
      - name: Decode upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UNINAV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured: skipping the release build."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/uninav-upload.jks"
          echo "UNINAV_KEYSTORE_FILE=$RUNNER_TEMP/uninav-upload.jks" >> "$GITHUB_ENV"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release AAB and APK
        if: steps.keystore.outputs.present == 'true'
        env:
          UNINAV_KEYSTORE_PASSWORD: ${{ secrets.UNINAV_KEYSTORE_PASSWORD }}
          UNINAV_KEY_ALIAS: ${{ secrets.UNINAV_KEY_ALIAS }}
          UNINAV_KEY_PASSWORD: ${{ secrets.UNINAV_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Upload release AAB (for Google Play)
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uni-vishwas-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload release APK
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uni-vishwas-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/uninav-upload.jks"
